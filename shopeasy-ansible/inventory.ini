# ShopEasy - inventory file

[webservers]
web1 ansible_host=192.168.56.11
web2 ansible_host=192.168.56.12

[dbservers]
db1 ansible_host=192.168.56.21

# parent group that contains every server of the project
[shopeasy:children]
webservers
dbservers

[shopeasy:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/shopeasy_key.pem
ansible_python_interpreter=/usr/bin/python3
